version: 2
updates:
  # Majors are not ignored: that rule kept mcp-go on v0.x long after v1 brought
  # protocol 2026-07-28. Dependabot proposes majors that keep the module path
  # (v0 to v1); a /v2 path change still needs a manual bump.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
