name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    # Runs before anything publishes: the tag, package.json and server.json must
    # name the same version, or postinstall.js and the MCP registry would point
    # at a release that does not match.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          # server.json carries the version twice: its own, and packages[0].version,
          # the npm version the MCP registry installs.
          for field in "package.json:.version" "server.json:.version" "server.json:.packages[0].version"; do
            f="${field%%:*}"
            got=$(node -p "require('./$f')${field#*:}")
            if [ "$got" != "$v" ]; then
              echo "::error file=$f::${field#*:} is $got, the tag says $v"
              exit 1
            fi
          done
          # The image entry names its tag in the identifier (drumsergio/cashpilot-mcp:vX.Y.Z).
          got=$(node -p "require('./server.json').packages.filter(p => p.registryType === 'oci').map(p => p.identifier.split(':').pop()).join(' ')")
          for tag in $got; do
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=server.json::the image entry names $tag, the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads tags and history; it publishes with GITHUB_TOKEN
          # from env, so the token stays out of .git/config.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # .goreleaser.yaml skips signing when the secrets are absent, which is
      # right for snapshots and wrong for a release: stop here instead.
      - name: Require the macOS signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=0
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # Signed build provenance for every archive in checksums.txt, stored by
      # GitHub and checkable with: gh attestation verify <archive> --repo <owner/repo>
      # GoReleaser has already published the release here, so a failed
      # attestation must not stop the npm and registry jobs that follow.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-checksums: dist/checksums.txt

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    # npm trusted publishing: GitHub's OIDC token proves who publishes, so no NPM_TOKEN to expire.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+; Node 24 ships both, so no ad-hoc npm install.
          node-version: '24'
          # A stale runner cache could hold an early 24.x with npm below 11.5.1.
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # postinstall.js verifies the binary against this copy, taken from the
      # release goreleaser just published, so a release asset replaced later
      # cannot pass. It must list every archive the package can download.
      - name: Bundle checksums.txt into the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          v="${GITHUB_REF_NAME#v}"
          for target in darwin_amd64.tar.gz darwin_arm64.tar.gz linux_amd64.tar.gz linux_arm64.tar.gz windows_amd64.zip windows_arm64.zip; do
            if ! grep -Eq "^[a-f0-9]{64}  cashpilot-mcp_${v}_${target}\$" checksums.txt; then
              echo "::error::checksums.txt has no entry for cashpilot-mcp_${v}_${target}"
              exit 1
            fi
          done
          npm pack --dry-run --json | jq -e '.[0].files | map(.path) | index("checksums.txt")' >/dev/null
      # v1.1.0 went to npm by mistake; npm 11 refuses to tag a lower version latest without --tag.
      - run: npm publish --loglevel verbose --tag latest

  mcp-registry:
    needs: npm-publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
